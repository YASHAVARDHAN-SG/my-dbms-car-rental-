version: 2.1

jobs:
  php-tests:
    docker:
      - image: cimg/php:8.2
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.json" }}-{{ arch }}
            - composer-v1-
      - run:
          name: Install dependencies
          command: composer install --no-interaction --prefer-dist
      - save_cache:
          key: composer-v1-{{ checksum "composer.json" }}-{{ arch }}
          paths:
            - vendor
      - setup_remote_docker
      - run:
          name: Build PHP application image
          command: |
            docker build \
              --tag "car-rental-portal:${CIRCLE_BUILD_NUM}" \
              .
      - run:
          name: Test built application image
          command: |
            set -eu
            IMAGE="car-rental-portal:${CIRCLE_BUILD_NUM}"
            NETWORK="car-rental-ci-${CIRCLE_BUILD_NUM}"
            CONTAINER="car-rental-ci-${CIRCLE_BUILD_NUM}"
            docker network create "$NETWORK"
            cleanup() {
              docker rm --force "$CONTAINER" >/dev/null 2>&1 || true
              docker network rm "$NETWORK" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            docker run --detach \
              --name "$CONTAINER" \
              --network "$NETWORK" \
              --network-alias car-rental-app \
              "$IMAGE"

            attempt=0
            while [ "$attempt" -lt 30 ]; do
              HTTP_STATUS=$(docker run --rm \
                --network "$NETWORK" \
                curlimages/curl:8.12.1 \
                --silent --show-error --output /dev/null --write-out '%{http_code}' \
                http://car-rental-app/) || HTTP_STATUS=
              case "$HTTP_STATUS" in
                200|503) break ;;
              esac
              attempt=$((attempt + 1))
              sleep 2
            done

            case "$HTTP_STATUS" in
              200|503) ;;
              *)
                docker logs "$CONTAINER"
                echo "Built application did not return an HTTP response." >&2
                exit 1
                ;;
            esac

            docker run --rm \
              --network "$NETWORK" \
              curlimages/curl:8.12.1 \
              --silent --show-error http://car-rental-app/ \
              | grep -q 'Find the Best'
            echo "Built application returned HTTP $HTTP_STATUS and rendered the homepage."
      - run:
          name: Run PHPUnit tests
          command: vendor/bin/phpunit --bootstrap tests/bootstrap.php --no-coverage tests/HelpersTest.php

workflows:
  php-tests:
    jobs:
      - php-tests
