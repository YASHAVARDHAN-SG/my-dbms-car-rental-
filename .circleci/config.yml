version: 2.1

jobs:
  car-rental-ci-cd:
    machine: true
    resource_class: yashavardhan-sg/car-rental-runner
    environment:
      SONARQUBE_IMAGE: sonarqube:lts-community
      SONAR_SCANNER_IMAGE: sonarsource/sonar-scanner-cli:latest
      CURL_IMAGE: curlimages/curl:8.12.1
      PACKAGER_IMAGE: alpine:3.21
      MARIADB_IMAGE: mariadb:11.4
    steps:
      - checkout
      - run:
          name: Pipeline started notification
          command: |
            if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
              docker run --rm "$CURL_IMAGE" \
                --silent --show-error --fail \
                --request POST \
                --header 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode "payload={\"text\":\"Car Rental pipeline started: ${CIRCLE_BUILD_URL}\"}" \
                "$SLACK_WEBHOOK_URL" || echo "Warning: Slack start notification failed." >&2
            else
              echo "SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
            fi
      - run:
          name: Start SonarQube
          command: |
            set -eu
            NETWORK=car-rental-sonarqube
            CONTAINER=car-rental-sonarqube
            docker info >/dev/null
            docker network inspect "$NETWORK" >/dev/null 2>&1 || docker network create "$NETWORK"
            docker volume create car-rental-sonarqube-data >/dev/null
            docker volume create car-rental-sonarqube-extensions >/dev/null
            docker volume create car-rental-sonarqube-logs >/dev/null

            if ! docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              docker container run --detach \
                --name "$CONTAINER" \
                --restart unless-stopped \
                --network "$NETWORK" \
                --network-alias sonarqube \
                --publish 9000:9000 \
                --volume car-rental-sonarqube-data:/opt/sonarqube/data \
                --volume car-rental-sonarqube-extensions:/opt/sonarqube/extensions \
                --volume car-rental-sonarqube-logs:/opt/sonarqube/logs \
                --ulimit nofile=131072:131072 \
                --ulimit nproc=8192:8192 \
                "$SONARQUBE_IMAGE"
            elif [ "$(docker container inspect --format '{{.State.Running}}' "$CONTAINER")" != true ]; then
              docker container start "$CONTAINER"
            fi

            attempt=0
            while [ "$attempt" -lt 120 ]; do
              if docker run --rm --network "$NETWORK" "$CURL_IMAGE" \
                --fail --silent --show-error http://sonarqube:9000/api/system/status 2>/dev/null \
                | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
                echo "SonarQube is ready."
                exit 0
              fi
              attempt=$((attempt + 1))
              sleep 5
            done

            docker container logs "$CONTAINER"
            docker container inspect --format \
              'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' \
              "$CONTAINER" || true
            echo "SonarQube did not become ready within 10 minutes." >&2
            exit 1
      - run:
          name: PHP unit tests and coverage
          command: |
            set -eu
            TEST_IMAGE="car-rental-php-tests:${CIRCLE_BUILD_NUM}"
            docker build \
              --file Dockerfile.test \
              --tag "$TEST_IMAGE" \
              .
            docker run --rm \
              --volume "$PWD:/workspace" \
              --workdir /workspace \
              --user "$(id -u):$(id -g)" \
              --env XDEBUG_MODE=coverage \
              "$TEST_IMAGE" \
              --configuration /workspace/phpunit.xml
            test -s coverage.xml
            echo "Coverage report generated:"
            ls -l coverage.xml
      - run:
          name: SonarQube analysis and quality gate
          command: |
            set -eu
            : "${SONAR_TOKEN:?Set SONAR_TOKEN in CircleCI project or context environment variables.}"
            docker run --rm \
              --network car-rental-sonarqube \
              --volume "$PWD:/usr/src" \
              --workdir /usr/src \
              --user "$(id -u):$(id -g)" \
              --env SONAR_USER_HOME=/tmp/sonar \
              --env SONAR_TOKEN \
              "$SONAR_SCANNER_IMAGE" \
              -Dsonar.host.url=http://sonarqube:9000 \
              -Dsonar.qualitygate.wait=true
      - run:
          name: Build source artifact
          command: |
            set -eu
            docker run --rm \
              --volume "$PWD:/workspace" \
              --workdir /workspace \
              --user "$(id -u):$(id -g)" \
              --env BUILD_NUMBER="$CIRCLE_BUILD_NUM" \
              "$PACKAGER_IMAGE" \
              sh -c '
                mkdir -p dist
                tar \
                  --exclude=./.git \
                  --exclude=./dist \
                  --exclude=./reports \
                  --exclude=./.scannerwork \
                  -czf "dist/car-rental-portal-${BUILD_NUMBER}.tar.gz" \
                  .
              '
      - store_artifacts:
          path: dist
          destination: car-rental-portal
      - run:
          name: Deploy to Docker
          command: |
            set -eu
            : "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in CircleCI project or context environment variables.}"
            : "${DB_PASSWORD:?Set DB_PASSWORD in CircleCI project or context environment variables.}"
            WEBSITE_PORT="${WEBSITE_PORT:-8080}"
            case "$WEBSITE_PORT" in
              ''|*[!0-9]*)
                echo "WEBSITE_PORT must be a port number from 1 to 65535." >&2
                exit 1
                ;;
            esac
            if [ "$WEBSITE_PORT" -lt 1 ] || [ "$WEBSITE_PORT" -gt 65535 ]; then
              echo "WEBSITE_PORT must be a port number from 1 to 65535." >&2
              exit 1
            fi

            docker network inspect car-rental-app >/dev/null 2>&1 || docker network create car-rental-app
            docker volume create car-rental-db-data >/dev/null
            DB_CONTAINER=car-rental-db
            if ! docker container inspect "$DB_CONTAINER" >/dev/null 2>&1; then
              docker run --detach \
                --name "$DB_CONTAINER" \
                --restart unless-stopped \
                --network car-rental-app \
                --network-alias car-rental-db \
                --env MARIADB_ROOT_PASSWORD="$DB_ROOT_PASSWORD" \
                --env MARIADB_DATABASE=carrental \
                --env MARIADB_USER=car_rental_app \
                --env MARIADB_PASSWORD="$DB_PASSWORD" \
                --health-cmd='healthcheck.sh --connect --innodb_initialized' \
                --health-interval=10s \
                --health-timeout=5s \
                --health-retries=10 \
                --volume car-rental-db-data:/var/lib/mysql \
                --volume "$PWD/carrental.sql:/docker-entrypoint-initdb.d/001-carrental.sql:ro" \
                "$MARIADB_IMAGE"
            elif [ "$(docker container inspect --format '{{.State.Running}}' "$DB_CONTAINER")" != true ]; then
              docker container start "$DB_CONTAINER"
            fi

            DB_NETWORKS=$(docker container inspect --format '{{json .NetworkSettings.Networks}}' "$DB_CONTAINER")
            if ! printf '%s' "$DB_NETWORKS" | grep -q '"car-rental-app"'; then
              docker network connect car-rental-app "$DB_CONTAINER"
            fi

            attempt=0
            while [ "$attempt" -lt 60 ]; do
              if TABLE_COUNT=$(docker run --rm \
                --network car-rental-app \
                --env MYSQL_PWD="$DB_PASSWORD" \
                "$MARIADB_IMAGE" \
                mariadb \
                  --connect-timeout=5 \
                  --host=car-rental-db \
                  --user=car_rental_app \
                  --database=carrental \
                  --batch \
                  --skip-column-names \
                  --execute="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('tblusers', 'tblbrands', 'tblvehicles', 'tblbooking')" \
                2>/dev/null); then
                if [ "$TABLE_COUNT" != 4 ]; then
                  echo "MariaDB is missing required app tables; migrate the existing database before deployment." >&2
                  exit 1
                fi
                break
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
            if [ "$attempt" -ge 60 ]; then
              docker logs --tail 80 "$DB_CONTAINER" || true
              echo "MariaDB did not become ready with the configured credentials." >&2
              exit 1
            fi

            IMAGE=car-rental-portal:latest
            CANDIDATE="car-rental-portal-candidate-${CIRCLE_BUILD_NUM}"
            ROLLBACK_IMAGE="car-rental-portal:rollback-${CIRCLE_BUILD_NUM}"
            OLD_IMAGE_REFS=$(docker image ls --format '{{.Repository}}:{{.Tag}}' car-rental-portal | sort -u)
            OLD_CONTAINER_IMAGE=
            ARCHIVE_DIR="${DOCKER_IMAGE_ARCHIVE_DIR:-$HOME/docker_images}"
            mkdir -p "$ARCHIVE_DIR"

            for OLD_IMAGE_REF in $OLD_IMAGE_REFS; do
              SAFE_TAG=$(printf '%s' "$OLD_IMAGE_REF" | tr ':/' '--')
              docker image save \
                --output "$ARCHIVE_DIR/${SAFE_TAG}-before-build-${CIRCLE_BUILD_NUM}.tar" \
                "$OLD_IMAGE_REF"
            done

            if docker container inspect car-rental-portal >/dev/null 2>&1; then
              OLD_CONTAINER_IMAGE=$(docker container inspect --format '{{.Image}}' car-rental-portal)
              docker image tag "$OLD_CONTAINER_IMAGE" "$ROLLBACK_IMAGE"
              docker image save \
                --output "$ARCHIVE_DIR/car-rental-portal-running-before-build-${CIRCLE_BUILD_NUM}.tar" \
                "$ROLLBACK_IMAGE"
            fi

            if ! docker build --pull --tag "$IMAGE" .; then
              docker image rm "$ROLLBACK_IMAGE" >/dev/null 2>&1 || true
              exit 1
            fi
            NEW_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE")

            docker rm --force car-rental-portal >/dev/null 2>&1 || true
            if ! docker run --detach \
              --name "$CANDIDATE" \
              --restart unless-stopped \
              --network car-rental-app \
              --publish "$WEBSITE_PORT:80" \
              --env DB_HOST=car-rental-db \
              --env DB_NAME=carrental \
              --env DB_USER=car_rental_app \
              --env DB_PASSWORD \
              "$IMAGE"; then
              docker rm --force "$CANDIDATE" >/dev/null 2>&1 || true
              if [ -n "$OLD_CONTAINER_IMAGE" ]; then
                docker image tag "$ROLLBACK_IMAGE" "$IMAGE"
                docker run --detach \
                  --name car-rental-portal \
                  --restart unless-stopped \
                  --network car-rental-app \
                  --publish "$WEBSITE_PORT:80" \
                  --env DB_HOST=car-rental-db \
                  --env DB_NAME=carrental \
                  --env DB_USER=car_rental_app \
                  --env DB_PASSWORD \
                  "$ROLLBACK_IMAGE" || true
              fi
              docker image rm "$ROLLBACK_IMAGE" >/dev/null 2>&1 || true
              if [ -n "$OLD_CONTAINER_IMAGE" ] && [ "$OLD_CONTAINER_IMAGE" != "$NEW_IMAGE_ID" ]; then
                docker image rm "$NEW_IMAGE_ID" >/dev/null 2>&1 || true
              fi
              echo "Could not start the website on host port $WEBSITE_PORT." >&2
              exit 1
            fi

            attempt=0
            while [ "$attempt" -lt 30 ]; do
              if HTTP_STATUS=$(docker run --rm --network host "$CURL_IMAGE" \
                --silent --show-error --output /dev/null --write-out '%{http_code}' \
                "http://127.0.0.1:$WEBSITE_PORT/"); then
                case "$HTTP_STATUS" in
                  2??)
                    docker rename "$CANDIDATE" car-rental-portal
                    docker image rm "$ROLLBACK_IMAGE" >/dev/null 2>&1 || true
                    for OLD_IMAGE_REF in $OLD_IMAGE_REFS; do
                      if [ "$OLD_IMAGE_REF" != "$IMAGE" ] && ! docker image rm "$OLD_IMAGE_REF"; then
                        echo "Warning: unable to remove previous image $OLD_IMAGE_REF." >&2
                      fi
                    done
                    if [ -n "$OLD_CONTAINER_IMAGE" ] && [ "$OLD_CONTAINER_IMAGE" != "$NEW_IMAGE_ID" ]; then
                      docker image rm "$OLD_CONTAINER_IMAGE" >/dev/null 2>&1 || true
                    fi
                    echo "Website is responding at http://<runner-host>:$WEBSITE_PORT/"
                    exit 0
                    ;;
                esac
              fi
              attempt=$((attempt + 1))
              sleep 2
            done

            docker logs "$CANDIDATE"
            docker rm --force "$CANDIDATE" >/dev/null 2>&1 || true
            if [ -n "$OLD_CONTAINER_IMAGE" ]; then
              docker image tag "$ROLLBACK_IMAGE" "$IMAGE"
              docker run --detach \
                --name car-rental-portal \
                --restart unless-stopped \
                --network car-rental-app \
                --publish "$WEBSITE_PORT:80" \
                --env DB_HOST=car-rental-db \
                --env DB_NAME=carrental \
                --env DB_USER=car_rental_app \
                --env DB_PASSWORD \
                "$ROLLBACK_IMAGE" || echo "Warning: website rollback could not start." >&2
            fi
            docker image rm "$ROLLBACK_IMAGE" >/dev/null 2>&1 || true
            if [ -n "$OLD_CONTAINER_IMAGE" ] && [ "$OLD_CONTAINER_IMAGE" != "$NEW_IMAGE_ID" ]; then
              docker image rm "$NEW_IMAGE_ID" >/dev/null 2>&1 || true
            fi
            echo "The website candidate did not respond; rollback was attempted." >&2
            exit 1
      - run:
          name: Success notification
          when: on_success
          command: |
            if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
              docker run --rm "$CURL_IMAGE" \
                --silent --show-error --fail \
                --request POST \
                --header 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode "payload={\"text\":\"Car Rental pipeline succeeded: ${CIRCLE_BUILD_URL}\"}" \
                "$SLACK_WEBHOOK_URL" || echo "Warning: Slack success notification failed." >&2
            fi
      - run:
          name: Failure notification
          when: on_fail
          command: |
            if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
              docker run --rm "$CURL_IMAGE" \
                --silent --show-error --fail \
                --request POST \
                --header 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode "payload={\"text\":\"Car Rental pipeline failed: ${CIRCLE_BUILD_URL}\"}" \
                "$SLACK_WEBHOOK_URL" || echo "Warning: Slack failure notification failed." >&2
            fi

workflows:
  car-rental-pipeline:
    jobs:
      - car-rental-ci-cd
